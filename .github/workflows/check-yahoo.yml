# Yahoo! の Client ID が使えるかを確かめるだけ（ID そのものは出さない。長さと形だけ）
name: check-yahoo
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 確かめる
        env:
          YAHOO_APPID: ${{ secrets.YAHOO_APPID }}
        run: |
          echo "長さ: ${#YAHOO_APPID}"
          echo "（形は確かめない：今の Client ID は dj0 で始まらないことがある）"
          case "$YAHOO_APPID" in *" "*|*$'\n'*) echo "空白か改行が入っている";; esac
          code=$(curl -s -o body.txt -w "%{http_code}" "https://shopping.yahooapis.jp/ShoppingWebService/V3/itemSearch?appid=$YAHOO_APPID&query=RTX%205080&results=1")
          echo "HTTP $code"; head -c 300 body.txt | sed "s/$YAHOO_APPID/***/g"; echo
          curl -s https://ipinfo.io/country || true
