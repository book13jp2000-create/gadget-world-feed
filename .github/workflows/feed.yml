# 株価などを取って GitHub Pages に出す（公開リポジトリ gadget-world-feed で動かす）
# 読む側：VRChat のワールド（https://book13jp2000-create.github.io/gadget-world-feed/stocks.json・news.json など）
name: feed
on:
  schedule:
    # 米国市場の時間帯（UTC 13:00〜21:59、月〜金）は15分ごと。夏時間・冬時間どちらも含む。毎時0分は GitHub が混むのでずらす
    - cron: '2,17,32,47 13-21 * * 1-5'
    # 東京市場の時間帯（日本時間 9:00〜15:30 ＝ UTC 0〜6時、月〜金）も15分ごと
    - cron: '2,17,32,47 0-6 * * 1-5'
    # それ以外は控えめに（毎日3時間ごと。平日の昼と重なる回はそのまま）
    - cron: '7 */3 * * *'
    # 注意：公開リポジトリで60日間コミットがないと schedule が止まる（GitHub の仕様）。止まったら Actions の画面で有効にし直す
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node stocks.js site
      # PCパーツは parts.yml が1日1回 data ブランチに書く。Pages は毎回まるごと置き換わるので、ここで一緒に載せる（無ければ載せない）
      - name: parts.json を data ブランチから
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:parts.json > site/parts.json 2>/dev/null && node -e "const j=require('./site/parts.json'); if(j.v!==1||j.sample) process.exit(1)" || rm -f site/parts.json
          fi
      # PCパーツの長い履歴（parts.yml が data ブランチに置く。11/16）
      - name: parts-1y/5y/max.json を data ブランチから
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            for r in 1y 5y max; do git show FETCH_HEAD:parts-$r.json > site/parts-$r.json 2>/dev/null && node -e "const j=require('./site/parts-$r.json'); if(j.v!==1) process.exit(1)" || rm -f site/parts-$r.json; done
          fi
      # 株価の長い履歴（history.yml が1日1回 data ブランチに置く。11/16）。無ければ載せない（ワールドのグラフは1か月だけ）
      - name: stocks-1y/5y/max.json を data ブランチから
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            for r in 1y 5y max; do git show FETCH_HEAD:stocks-$r.json > site/stocks-$r.json 2>/dev/null && node -e "const j=require('./site/stocks-$r.json'); if(j.v!==1) process.exit(1)" || rm -f site/stocks-$r.json; done
          fi
      # 週刊チラシ（flyer.yml が土曜に data ブランチに置く）。無ければ載せない（ワールドの板は「準備中」）
      - name: flyer.png を data ブランチから
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:flyer.png > site/flyer.png 2>/dev/null || rm -f site/flyer.png
            for g in pc sp pcs audio camera game home kitchen; do git show FETCH_HEAD:flyer-$g.png > site/flyer-$g.png 2>/dev/null || rm -f site/flyer-$g.png; done
            git show FETCH_HEAD:flyer.json > site/flyer.json 2>/dev/null || rm -f site/flyer.json
          fi
      # 流れるニュース（11/15 本人承認）。RSS の負担を考え、公開中の news.json が 55 分より新しければ取り直さずにそのまま載せる。
      # 取れなかった回・見出しの無いジャンルがある回は、公開中の物を載せ直す（Pages は毎回まるごと置き換わるため）。失敗してもほかの公開は止めない
      - name: news.json
        continue-on-error: true
        run: |
          # ?t= で Pages のキャッシュを避けて、公開中の物を取る（Codex のチェック）
          curl -fsS --max-time 20 "https://book13jp2000-create.github.io/gadget-world-feed/news.json?t=$(date +%s)" -o prev-news.json || rm -f prev-news.json
          # 公開中の物の古さ（分）。無い・形が違う・日時が読めない・未来の日時は 999999（＝取り直す、載せ直さない）
          age=999999
          if [ -f prev-news.json ]; then age=$(node -e "try{const j=require('./prev-news.json');const t=Date.parse(j.updated);const a=Math.floor((Date.now()-t)/60000);console.log(j.v!==1||j.sample||!Number.isFinite(a)||a<0?999999:a)}catch(e){console.log(999999)}"); fi
          echo "公開中の news.json は ${age} 分前（999999＝無い・使えない）"
          if [ "$age" -ge 55 ]; then
            if node news.js site; then echo "news.json を作り直した"; else echo "::warning::news.js が失敗した"; fi
          fi
          if [ ! -f site/news.json ] && [ -f prev-news.json ] && [ "$age" -lt 999999 ]; then cp prev-news.json site/news.json; echo "公開中の news.json を載せ直した"; fi
          if [ -f site/news.json ]; then ls -l site/news.json; else echo "::warning::news.json は今回載らない（ワールドの帯は「準備中」と出す）"; fi
      - run: cp index.html site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
